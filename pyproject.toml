[project]
name = "oscarmoreno-site"
version = "0.1.0"
description = "Static site builder for oscarmoreno.com"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "pygments>=2.21.0",
]

[project.scripts]
site = "builder.cli:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "builder"
module-root = ""

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
